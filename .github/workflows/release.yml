name: Release

# On a version tag, build every platform bundle and attach them to the GitHub Release:
#   - macOS: a single UNIVERSAL .dmg/.app (Intel + Apple Silicon)
#   - Linux: .deb + .AppImage
# The release body is taken from the matching CHANGELOG.md section. Not signed by Apple (alpha):
# the macOS app is signed with the project's own self-signed certificate, which gives it the same
# identity in every release, so macOS keeps the permissions a user granted across updates. The
# update archives are signed with the app's own updater key, and latest.json is published next
# to them for the in-app updater.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (webkit2gtk + bundling)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps + build the vendored xterm bundle
        # renderer/xterm-bundle.js is gitignored, so the checkout doesn't have it —
        # regenerate it before Tauri bundles the renderer, or the app ships broken.
        run: |
          npm ci
          npm run build:xterm

      - name: Extract this tag's CHANGELOG section as the release body
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '/^## \[/{on = ($0 ~ ("\\[" v "\\]")); next} on' CHANGELOG.md > RELEASE_NOTES.md
          {
            echo 'body<<AO_EOF'
            cat RELEASE_NOTES.md
            echo 'AO_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Import the macOS signing certificate
        # Without a certificate the app is signed ad hoc, and an ad-hoc identity changes with
        # every build: macOS then treats each release as a new app and asks the user again for
        # every folder permission. The certificate is self-signed, so Gatekeeper still warns on
        # first install; only the identity is made stable. It goes into a keychain of its own,
        # and tauri-action finds it by name (APPLE_SIGNING_IDENTITY below).
        if: matrix.platform == 'macos-15'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the in-app update archives and lets tauri-action publish latest.json.
          # Our own key (tauri signer generate), not an Apple certificate; the public half
          # is in tauri.conf.json. Without this secret the bundle step fails, because
          # this build turns createUpdaterArtifacts on (tauri.updater.conf.json, below).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The certificate imported above, by its name. Empty on Linux, which signs nothing.
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-15' && 'AI Agents Orchestrator' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          # Every -alpha version is released as a stable one, and the in-app updater reads
          # releases/latest, which skips prereleases: a tag left a prerelease would never be
          # offered, with no error anywhere. It used to be flipped by hand after each build.
          prerelease: false
          # Update archives and their signatures are built for releases only: a local
          # `cargo tauri build` has no signing key and would fail with them on.
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

      - name: Check the macOS app has a stable identity
        # An ad-hoc signature has no certificate leaf in its designated requirement. A release
        # that falls back to it would quietly bring the permission prompts back.
        if: matrix.platform == 'macos-15'
        run: |
          APP=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          REQ=$(codesign -d -r- "$APP" 2>&1)
          echo "$REQ"
          echo "$REQ" | grep -q 'identifier "com.aiagentsorchestrator.app" and certificate leaf'
