name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  js:
    name: Renderer logic + secret scan
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: No committed secrets
        run: npm run check:secrets
      - name: Unit tests (renderer/lib)
        run: npm test
      - name: Python tests (hooks + skills/lib selftests)
        run: npm run test:py
      - name: Vendored xterm bundle is current
        run: npm run check:bundle
      - name: Browser for the UI smoke tests
        run: npx playwright install chromium
      - name: UI smoke tests (scripts/smoke)
        # The renderer in a real browser, with the Rust side stubbed. Guards the defects
        # that only a layout engine can see — an invisible menu row, a dialog that is
        # always open, a panel outside its scroll container.
        run: npm run test:ui

  rust:
    name: Rust backend (clippy + tests, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Linux too: the cfg(not(target_os = "macos")) code is otherwise first compiled
        # by release.yml, at tag time.
        platform: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (webkit2gtk, as in release.yml)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy (warnings = errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
